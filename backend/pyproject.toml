[project]
name = "hackathon-backend"
version = "0.1.0"
description = "FastAPI + LangChain + OpenRouter + Langfuse + pgvector boilerplate"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "pgvector>=0.3.6",
    "langchain>=0.3",
    "langchain-openai>=0.2",
    "langfuse>=4.0",
    "openai>=1.54",
    "alembic>=1.19.1",
    "pandas>=3.0.5",
    "numpy>=2.4.6",
    "httpx>=0.28",
    "selectolax>=0.3.21",
    "camoufox[geoip]>=0.4.11",
]

[dependency-groups]
lint = ["ruff>=0.16.3"]
dev = [
    { include-group = "lint" },
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "httpx>=0.28.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.uv]
python-downloads = "manual"
default-groups = []

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
