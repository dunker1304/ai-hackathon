services:
  db:
    image: pgvector/pgvector:pg16
    container_name: hackathon-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: devsecret
      POSTGRES_DB: hackathon
    ports:
      - "5632:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
